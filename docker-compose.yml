# docker-compose.yml
services:
  db:
    image: postgres:14
    restart: always
    container_name: db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  web:
    build: .
    restart: always
    container_name: web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy  # Espera hasta que db esté healthy
    networks:
      - app_network
    environment:
      - DATABASE_HOST=db

  # Servidor Nginx
  nginx:
    image: nginx:alpine
    restart: always
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"  # Opcional para HTTPS
    volumes:
      - ./web/static:/static  # Para servir archivos estáticos
      - ./web/media:/media    # Para servir archivos multimedia
    depends_on:
      - web
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  pgdata: