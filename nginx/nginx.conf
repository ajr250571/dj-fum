events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Configuración para manejo de tenants
    map $http_host $tenant_name {
        default "public";
        "~^(?<tenant>[\w-]+)\.localhost$" $tenant;
        "~^(?<tenant>[\w-]+)\.tudominio\.com$" $tenant;
    }

    # Upstream para Django
    upstream web {
        server web:8000;
    }

    # Configuración principal
    server {
        listen 80;
        server_name localhost *.localhost;
        
        # Para producción, descomenta y configura:
        # listen 443 ssl;
        # ssl_certificate /etc/nginx/ssl/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl/key.pem;

        client_max_body_size 100M;

        # Archivos estáticos
        location /static/ {
            alias /static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Archivos multimedia
        location /media/ {
            alias /media/;
            expires 30d;
        }

        # API y Admin
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
            
            # Headers específicos para tenants
            proxy_set_header X-Tenant $tenant_name;
            
            # Timeouts
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Health check
        location /health/ {
            proxy_pass http://web/health/;
            access_log off;
        }
    }
}